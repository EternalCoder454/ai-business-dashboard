name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an older run pointless. Cancelling frees the runner and
# stops two results arriving for the same branch in the wrong order.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types first. Everything below it is slower and most of what it would
      # catch, it catches here.
      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The checks that need nothing but the source: the door, the schemas,
      # permissions, the tenancy audit, and the rest. Anything needing a
      # database or a key lives in test:db and is not run here.
      - name: Checks
        run: npm test

      # Last, because it is the slowest and a type error would have stopped it
      # anyway. Also the only step that would catch a bad import path in a
      # server component.
      - name: Build
        env:
          # Enough to build. Nothing here reaches a real service: the build
          # must not depend on secrets, or a fork's pull request cannot run it.
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
