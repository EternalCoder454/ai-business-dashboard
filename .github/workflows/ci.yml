name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Its own gate. `next build` is not a substitute: it does not fail on a
      # type error in code that is never imported by a route.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The database round trip is not run here: it needs a real DATABASE_URL,
      # and CI has no business holding production credentials. Run npm run
      # smoke locally after any change to the schema or the repository layer.
